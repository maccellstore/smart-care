<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Inner Dark Frame -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="#0F172A" fill-opacity="0.92"/>

  <!-- Circuit Grid Accents -->
  <path d="M120 120 h40 v40" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="160" cy="160" r="5" fill="#38BDF8" opacity="0.8"/>
  <path d="M392 120 h-40 v40" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="352" cy="160" r="5" fill="#A78BFA" opacity="0.8"/>
  <path d="M120 392 h40 v-40" stroke="#34D399" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="160" cy="352" r="5" fill="#34D399" opacity="0.8"/>
  <path d="M392 392 h-40 v-40" stroke="#FB923C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="352" cy="352" r="5" fill="#FB923C" opacity="0.8"/>

  <!-- Device Outline: Laptop / Tablet combo -->
  <rect x="140" y="160" width="232" height="150" rx="14" fill="#1E293B" stroke="#60A5FA" stroke-width="6"/>
  <path d="M110 326 h292 a14 14 0 0 1 14 14 v4 a6 6 0 0 1 -6 6 h-308 a6 6 0 0 1 -6 -6 v-4 a14 14 0 0 1 14 -14 z" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
  
  <!-- Screen Pulse Line / Shield Care Heartbeat -->
  <path d="M 160 235 L 210 235 L 230 190 L 256 270 L 282 210 L 302 235 L 352 235" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Screwdriver / Wrench / Care Cross Badge -->
  <circle cx="370" cy="150" r="38" fill="url(#primaryGrad)"/>
  <path d="M 370 132 L 370 168 M 352 150 L 388 150" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
</svg>
